  </g>
  <line x1="34" y1="55" x2="1246" y2="55" stroke="#BAADDC" stroke-opacity="0.28"></line>

  <text x="34" y="90" font-size="13" letter-spacing="2" fill="#7A66B8">//IDENTITY_</text>
  <g font-family="Chakra Petch, JetBrains Mono, Menlo, monospace" font-weight="700" font-size="54" letter-spacing="6">
    <text x="34" y="144" fill="#8C68D6" filter="url(#glow)">THAINÁ RAMOS</text>
    <text x="34" y="144" fill="#EDE7FA">THAINÁ RAMOS</text>
  </g>
  <text x="34" y="178" font-size="18" letter-spacing="0.4" fill="#BAADDC">process engineering · context · human–ai collaboration</text>
