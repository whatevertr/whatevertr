    <text x="1246" y="159" letter-spacing="1" fill="#DCD3F0" text-anchor="end">DATED · VERSIONED · FLAGGED</text>
    <line x1="862" y1="169" x2="1246" y2="169" stroke="#BAADDC" stroke-opacity="0.40"></line>
  </g>

