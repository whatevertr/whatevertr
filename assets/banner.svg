    <text x="1246" y="128" letter-spacing="1" fill="#DCD3F0" text-anchor="end">CONSTELLATION · BLIND AUDIT</text>
    <line x1="862" y1="138" x2="1246" y2="138" stroke="#BAADDC" stroke-opacity="0.18"></line>
