<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="320" viewBox="0 0 1280 320" font-family="JetBrains Mono, Menlo, Consolas, monospace">
  <defs>
    <radialGradient id="haze" cx="0.12" cy="0.30" r="0.85">
      <stop offset="0%" stop-color="#5D3AA8" stop-opacity="0.32"></stop>
      <stop offset="60%" stop-color="#5D3AA8" stop-opacity="0"></stop>
    </radialGradient>
    <pattern id="scan" width="3" height="3" patternUnits="userSpaceOnUse">
      <rect width="3" height="1" fill="#BAADDC" opacity="0.055"></rect>
    </pattern>
    <pattern id="dither" width="3" height="3" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="0.5" fill="#BAADDC" opacity="0.10"></circle>
    </pattern>
    <filter id="glow" x="-30%" y="-60%" width="160%" height="220%">
      <feGaussianBlur stdDeviation="9"></feGaussianBlur>
    </filter>
    <filter id="dot" x="-120%" y="-120%" width="340%" height="340%">
      <feGaussianBlur stdDeviation="4" result="b"></feGaussianBlur>
      <feMerge><feMergeNode in="b"></feMergeNode><feMergeNode in="b"></feMergeNode><feMergeNode in="SourceGraphic"></feMergeNode></feMerge>
    </filter>
  </defs>

  <rect width="1280" height="320" fill="#0B0524"></rect>
  <rect width="1280" height="320" fill="url(#haze)"></rect>
  <rect width="1280" height="320" fill="url(#scan)"></rect>
  <rect width="1280" height="320" fill="url(#dither)"></rect>
  <rect x="0.5" y="0.5" width="1279" height="319" fill="none" stroke="#4A3A7A"></rect>

  <g stroke="#BAADDC" stroke-width="2" fill="none">
    <path d="M10 26 V10 H26"></path>
    <path d="M1270 26 V10 H1254"></path>
    <path d="M10 294 V310 H26"></path>
    <path d="M1270 294 V310 H1254"></path>
  </g>

